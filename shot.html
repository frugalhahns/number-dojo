<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>shot</title>
<link rel="stylesheet" href="css/dojo.css"></head><body data-hue="home">
<script type="module">
const P = new URLSearchParams(location.search);
const html = await fetch('index.html').then(r => r.text());
const doc = new DOMParser().parseFromString(html, 'text/html');
for (const n of Array.from(doc.body.children)) if (n.tagName !== 'SCRIPT') document.body.appendChild(document.importNode(n, true));
const St = await import('./js/state.js');
St.setSlot('3'); localStorage.removeItem('nd.save.v1.s3'); St.load();
const S = St.S;
if (P.get('seed')) { S.buddy='pikachu'; S.team=['pikachu','chikorita','wooper','magikarp','marill']; S.level=6; S.xp=14; S.badges=['add']; S.sessions={add:3,mul:1}; S.shownStage=1; S.lv={'add.scale':2,'mul.distribute':2}; S.steps=214; S.best=19; St.save(); }
await import('./js/main.js');
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const $$ = s => Array.from(document.querySelectorAll(s));
const btn = t => $$('button').find(b=>b.textContent.trim()===t) || $$('button').find(b=>b.textContent.includes(t));
const want = P.get('at') || 'home';
await sleep(80);
if (want !== 'pick' && !document.querySelector('.gyms')) { $$('.choice').find(c=>c.textContent.includes('Pikachu')).click(); await sleep(150); }
const { peek } = await import('./js/solve.js');
async function tap(n){ for (const ch of String(n)) { $$('.key').find(b=>b.textContent===ch).click(); await sleep(10); } }
if (want.startsWith('gym')) { $$('.gym')[+want.slice(3)].click(); await sleep(150); }
if (want.startsWith('demo')) { $$('.gym')[+want.slice(4,5)].click(); await sleep(120); $$('.movecard')[+want.slice(5,6)].click(); await sleep(120);
  const clicks = want.length > 6 ? +want.slice(6) : 9;
  for(let i=0;i<clicks;i++){const b=btn('Show me the first step')||btn('Then what?'); if(!b||b.disabled)break; b.click(); await sleep(40);} }
if (want.startsWith('solve')) { const g=+want.slice(5,6), m=+want.slice(6,7), st=+(want.slice(7)||0);
  $$('.gym')[g].click(); await sleep(120); $$('.movecard')[m].click(); await sleep(120); btn('I will try it').click(); await sleep(200);
  for(let i=0;i<st;i++){ await tap(peek().step.answer); await sleep(400); } }
if (want === 'reward') { $$('.gym')[2].click(); await sleep(120); btn('Mixed training').click(); await sleep(200);
  for(let n=0;n<5;n++){ while(peek().step){ await tap(peek().step.answer); await sleep(360);} await sleep(120); (btn('Next one')||btn('Finish the run')).click(); await sleep(200);} }
if (want === 'team') { btn('My team').click(); await sleep(150); }
await sleep(300);
document.documentElement.dataset.done='1';
</script></body></html>
